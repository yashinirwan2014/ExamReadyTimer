name: ExamReadyTimer Application Test Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-application:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI & Tkinter System Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth

      - name: Install Application Core Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib pytest

      - name: Verify Module Compilation (Syntax Check)
        run: |
          python -m py_compile main.py GUI.py countdown.py pomodoro.py timetable.py tracker.py progress.py focus.py storage.py

      - name: Run Portable Storage Unit Tests
        run: python -m pytest -q tests/test_storage.py

      - name: Verify System Python Has Tkinter
        run: |
          /usr/bin/python3 -c "import tkinter; print('System Tkinter import successful')"

      - name: Run Headless UI Smoke Test
        shell: bash
        timeout-minutes: 2
        run: |
          set +e
          xvfb-run --auto-servernum timeout --signal=TERM --kill-after=5s 10s /usr/bin/python3 main.py
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 124 ]; then
            echo "Application remained open for 10 seconds under the virtual display."
          elif [ "$exit_code" -eq 0 ]; then
            echo "::error::Application exited before the 10-second smoke-test timeout."
            exit 1
          else
            echo "::error::Application launch failed with exit code $exit_code."
            exit "$exit_code"
          fi
