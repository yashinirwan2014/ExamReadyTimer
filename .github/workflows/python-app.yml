name: ExamReadyTimer Application Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Linux GUI & Tkinter System Requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Application Core Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installing your specific IP core stack
        pip install pandas matplotlib pytest

    - name: Verify Module Compilation (Syntax Check)
      run: |
        # This ensures all your script files parse and link without breaking syntax errors
        python -m py_compile main.py GUI.py countdown.py pomodoro.py timetable.py tracker.py progress.py focus.py

    - name: Run Headless UI Sanity Verification with Auto-Timeout
      run: |
        # xvfb runs the GUI in the background, and 'timeout 10s' forces it to shut down cleanly after 10 seconds.
        xvfb-run --auto-servernum timeout 10s python main.py || [[ $? -eq 124 ]]
        
