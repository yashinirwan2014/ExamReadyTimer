name: ExamReadyTimer Application Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-application:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Linux GUI & Tkinter System Requirements
      run: |
        sudo apt-get update
        # Added xvfb-run system binaries directly to ensure the wrapper tool exists
        sudo apt-get install -y python3-tk xvfb xauth

    - name: Install Application Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib pytest

    - name: Verify Module Compilation (Syntax Check)
      run: |
        # Ensure your filenames here EXACTLY match the physical filenames in your repository
        python -m py_compile main.py GUI.py countdown.py pomodoro.py timetable.py tracker.py progress.py focus.py

    - name: Run Headless UI Sanity Verification with Auto-Timeout
      run: |
        # Safely run the app for 10 seconds and explicitly treat timeout (124) as a success (0)
        xvfb-run --auto-servernum timeout 10s python main.py || EXIT_CODE=$?
        if [ $EXIT_CODE -eq 124 ]; then
          echo "Application launched successfully and timed out cleanly as expected."
          exit 0
        else
          echo "Application crashed with unexpected exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi
        
