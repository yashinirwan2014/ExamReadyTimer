name: Build downloadable desktop apps

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ExamReadyTimer-Windows
          - os: ubuntu-24.04
            artifact: ExamReadyTimer-Linux
          - os: macos-latest
            artifact: ExamReadyTimer-macOS

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Verify release source compilation
        run: python -m py_compile main.py GUI.py countdown.py pomodoro.py timetable.py tracker.py progress.py focus.py settings.py readiness.py backup.py storage.py schedule_utils.py reminders.py scripts/validate_study_data.py

      - name: Build dashboard and feature executables
        shell: bash
        run: |
          set -e
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi

          pyinstaller --noconfirm --clean --onefile --windowed --name ExamReadyTimer GUI.py
          for spec in \
            "ExamCountdown:countdown.py" \
            "PomodoroTimer:pomodoro.py" \
            "StudyTimetable:timetable.py" \
            "SubjectTracker:tracker.py" \
            "ProgressAnalytics:progress.py" \
            "FocusMode:focus.py" \
            "ExamReadySettings:settings.py" \
            "ExamReadiness:readiness.py"
          do
            name="${spec%%:*}"
            script="${spec#*:}"
            if [ "${{ runner.os }}" = "macOS" ]; then
              pyinstaller --noconfirm --clean --onefile --name "$name" "$script"
            else
              pyinstaller --noconfirm --clean --onefile --windowed --name "$name" "$script"
            fi
          done

          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR="dist/ExamReadyTimer.app/Contents/MacOS"
            mkdir -p "$APP_DIR"
            for name in ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness; do
              cp "dist/$name" "$APP_DIR/"
            done
            cp dataorsubjects.csv dataexams.csv datatimetable.csv "$APP_DIR/"
            cp -R dist/ExamReadyTimer.app release/
          else
            cp "dist/ExamReadyTimer$EXT" release/
            for name in ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness; do
              cp "dist/$name$EXT" release/
            done
            cp dataorsubjects.csv dataexams.csv datatimetable.csv release/
          fi

          cat > release/README-FIRST.txt <<'EOF'
          ExamReadyTimer desktop release

          Windows: double-click ExamReadyTimer.exe
          Linux: make the files executable if needed (chmod +x ExamReadyTimer ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness), then run ./ExamReadyTimer.
          macOS: move ExamReadyTimer.app to Applications, then open it. If macOS blocks the first launch because the app is not notarized, Control-click the app, choose Open, and confirm.

          Keep all executables and CSV files together in the same folder.
          Your study data is stored in your operating system's per-user ExamReadyTimer data folder, not in the installation folder. Existing data is preserved when you upgrade. Back up that data folder before reinstalling or moving to another computer.
          EOF

      - name: Create ZIP archive
        shell: bash
        run: |
          cd release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cd ..
            ditto -c -k --sequesterRsrc --keepParent release "${{ matrix.artifact }}.zip"
          else
            zip -r "../${{ matrix.artifact }}.zip" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish permanent GitHub Release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.0.0]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-Windows
          path: release-assets
      - name: Download Linux desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-Linux
          path: release-assets
      - name: Download macOS desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-macOS
          path: release-assets
      - name: Create formal release and upload desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: ExamReadyTimer v1.0.0
          body: |
            ## ExamReadyTimer v1.0.0

            First public desktop release of ExamReadyTimer.

            ### Downloads
            - **Windows:** ExamReadyTimer-Windows.zip
            - **Linux:** ExamReadyTimer-Linux.zip
            - **macOS:** ExamReadyTimer-macOS.zip

            Extract the ZIP. On macOS, move ExamReadyTimer.app to Applications and open it. See README-FIRST.txt inside each archive for launch and data-preservation instructions.
          files: |
            release-assets/ExamReadyTimer-Windows.zip
            release-assets/ExamReadyTimer-Linux.zip
            release-assets/ExamReadyTimer-macOS.zip
          fail_on_unmatched_files: true
          make_latest: true
