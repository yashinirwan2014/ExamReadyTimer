name: Build downloadable desktop apps

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate v1.0.0 source and GUI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Tk and test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
          python -m pip install --upgrade pip pytest
      - name: Compile all application modules
        run: python -m py_compile main.py GUI.py countdown.py pomodoro.py completion_sound.py timetable.py tracker.py progress.py focus.py settings.py readiness.py studyhub.py study_engine.py backup.py storage.py schedule_utils.py reminders.py scripts/validate_study_data.py
      - name: Run complete tests with a virtual display
        run: xvfb-run --auto-servernum python -m pytest -q tests

  build:
    name: Build for ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ExamReadyTimer-Windows
          - os: ubuntu-24.04
            artifact: ExamReadyTimer-Linux
          - os: macos-latest
            artifact: ExamReadyTimer-macOS

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Verify release source compilation
        run: python -m py_compile main.py GUI.py countdown.py pomodoro.py completion_sound.py timetable.py tracker.py progress.py focus.py settings.py readiness.py studyhub.py study_engine.py backup.py storage.py schedule_utils.py reminders.py scripts/validate_study_data.py

      - name: Build dashboard and feature executables
        shell: bash
        run: |
          set -e
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
            FONT_DATA="assets/MomoTrustDisplay-Regular.ttf;assets"
          else
            EXT=""
            FONT_DATA="assets/MomoTrustDisplay-Regular.ttf:assets"
          fi

          pyinstaller --noconfirm --clean --onefile --windowed --add-data "$FONT_DATA" --name ExamReadyTimer GUI.py
          specs=(
            "ExamCountdown:countdown.py"
            "PomodoroTimer:pomodoro.py"
            "StudyTimetable:timetable.py"
            "SubjectTracker:tracker.py"
            "ProgressAnalytics:progress.py"
            "FocusMode:focus.py"
            "ExamReadySettings:settings.py"
            "ExamReadiness:readiness.py"
            "StudyIntelligence:studyhub.py"
          )
          for spec in "${specs[@]}"; do
            name="${spec%%:*}"
            script="${spec#*:}"
            if [ "${{ runner.os }}" = "macOS" ]; then
              pyinstaller --noconfirm --clean --onefile --add-data "$FONT_DATA" --name "$name" "$script"
            else
              pyinstaller --noconfirm --clean --onefile --windowed --add-data "$FONT_DATA" --name "$name" "$script"
            fi
          done

          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_DIR="dist/ExamReadyTimer.app/Contents/MacOS"
            mkdir -p "$APP_DIR"
            for name in ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness StudyIntelligence; do
              cp "dist/$name" "$APP_DIR/"
            done
            cp dataorsubjects.csv dataexams.csv datatimetable.csv "$APP_DIR/"
            cp -R dist/ExamReadyTimer.app release/

            # PyInstaller signs the initial bundle before we add the feature
            # executables and CSV files. Re-sign the completed bundle so its
            # resource seal matches the final contents.
            # This is an ad-hoc signature for bundle integrity only. It is
            # NOT a Developer ID signature and cannot be Apple-notarized.
            codesign --force --deep --sign - --timestamp=none release/ExamReadyTimer.app
            codesign --verify --deep --strict --verbose=2 release/ExamReadyTimer.app
            codesign --display --verbose=4 release/ExamReadyTimer.app

            # Gatekeeper rejection is expected for an unnotarized community
            # build. Record the result explicitly; never treat it as trusted.
            if spctl --assess --type execute --verbose=2 release/ExamReadyTimer.app; then
              echo "Gatekeeper accepted this app."
            else
              echo "::warning::Gatekeeper rejected this unnotarized build. Do not advertise it as a normally trusted macOS app."
            fi
          else
            cp "dist/ExamReadyTimer$EXT" release/
            for name in ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness StudyIntelligence; do
              cp "dist/$name$EXT" release/
            done
            cp dataorsubjects.csv dataexams.csv datatimetable.csv release/
          fi

          cp assets/MomoTrustDisplay-Regular.ttf assets/MOMO-FONT-LICENSE.txt release/
          cat > release/README-FIRST.txt <<'EOF'
          ExamReadyTimer desktop release

          Windows: double-click ExamReadyTimer.exe
          Linux: make the files executable if needed (chmod +x ExamReadyTimer ExamCountdown PomodoroTimer StudyTimetable SubjectTracker ProgressAnalytics FocusMode ExamReadySettings ExamReadiness StudyIntelligence), then run ./ExamReadyTimer.
          macOS: move ExamReadyTimer.app to Applications. This community build is ad-hoc signed, not Developer ID signed or Apple-notarized. On first launch, macOS may block it because it is from an unidentified developer. To remove the download quarantine for this app only, open Terminal and run:
          xattr -dr com.apple.quarantine "/Applications/ExamReadyTimer.app"
          Then Control-click ExamReadyTimer.app, choose Open, and confirm. Only do this if you downloaded it from the official ExamReadyTimer GitHub release.

          The bundled MoMo Trust Display font is loaded by the app; its SIL Open Font License is in MOMO-FONT-LICENSE.txt.
          Keep all executables and CSV files together in the same folder.
          Your study data is stored in your operating system's per-user ExamReadyTimer data folder, not in the installation folder. Existing data is preserved when you upgrade. Back up that data folder before reinstalling or moving to another computer.
          EOF

      - name: Create ZIP archive
        shell: bash
        run: |
          cd release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cd ..
            ditto -c -k --sequesterRsrc --keepParent release "${{ matrix.artifact }}.zip"
          else
            zip -r "../${{ matrix.artifact }}.zip" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish permanent GitHub Release assets
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v1.0.0]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-Windows
          path: release-assets
      - name: Download Linux desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-Linux
          path: release-assets
      - name: Download macOS desktop ZIP
        uses: actions/download-artifact@v4
        with:
          name: ExamReadyTimer-macOS
          path: release-assets
      - name: Create formal release and upload desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: ExamReadyTimer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          body: |
            ## ExamReadyTimer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}

            Clean ExamReadyTimer v1.0.0 release with a black-gradient interface, white bold MoMo Trust Display typography, restored study tools, and automatic Pomodoro focus/break cycles with an original two-tone completion chime.

            **macOS notice:** The macOS ZIP is an experimental community build. It is ad-hoc signed only; it is NOT Developer ID signed or Apple-notarized. Gatekeeper may block it. Do not treat a successful GitHub build as Apple approval. Download only if you understand this limitation.

            - Backup restore validates every archive entry and file before changing existing data, stages replacements first, and rolls back if installation fails.
            - Exam readiness rejects invalid non-finite planning values instead of displaying misleading estimates.
            - Includes the complete desktop feature set, local data storage, study-session ledger, revision planning, backup and restore, and updated Windows, macOS and Linux packages.

            ### Downloads
            - **Windows:** ExamReadyTimer-Windows.zip
            - **Linux:** ExamReadyTimer-Linux.zip
            - **macOS (experimental, unnotarized):** ExamReadyTimer-macOS.zip

            Extract the ZIP. On macOS, move ExamReadyTimer.app to Applications and open it. See README-FIRST.txt inside each archive for launch and data-preservation instructions.
          files: |
            release-assets/ExamReadyTimer-Windows.zip
            release-assets/ExamReadyTimer-Linux.zip
            release-assets/ExamReadyTimer-macOS.zip
          fail_on_unmatched_files: true
          make_latest: true
