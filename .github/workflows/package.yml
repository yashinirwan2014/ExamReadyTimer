
name: ExamReadyTimer Cross-Platform Package Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib pytest

      - name: Test Portable User Data Storage
        run: python -m pytest -q tests/test_storage.py

      - name: Test Pandas Data Pipeline Loading
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import pandas as pd

          csv_file = "dataorsubjects.csv"

          try:
              if not os.path.exists(csv_file):
                  raise FileNotFoundError(f"{csv_file} not found")

              df = pd.read_csv(csv_file, encoding="utf-8-sig")

              if df.empty:
                  raise ValueError("CSV file is empty")

              required_columns = {"Subject", "Chapter", "Status"}
              missing_columns = required_columns - set(df.columns)

              if missing_columns:
                  raise ValueError(
                      f"Missing columns: {sorted(missing_columns)}"
                  )

              print("CSV pipeline test passed!")
              print(f"Rows loaded: {len(df)}")
              print(f"Columns: {list(df.columns)}")

          except Exception as e:
              print(f"Pipeline verification failed: {e}")
              sys.exit(1)
          PY
          
