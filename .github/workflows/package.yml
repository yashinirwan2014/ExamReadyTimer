
name: ExamReadyTimer Cross-Platform Package Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cross-platform-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib

      - name: Test Pandas Data Pipeline Loading
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import pandas as pd

          # Force UTF-8 output
          if hasattr(sys.stdout, "reconfigure"):
              sys.stdout.reconfigure(
                  encoding="utf-8",
                  errors="replace"
              )

          filename = "dataorsubjects.csv"

          # Create mock data only if the CSV is missing
          if not os.path.exists(filename):
              print("[WARNING] Datafile not found.")
              print("[INFO] Creating mock CSV for pipeline check.")

              df_mock = pd.DataFrame({
                  "subject": ["Math", "Science"],
                  "time": [25, 50]
              })

              df_mock.to_csv(
                  filename,
                  index=False,
                  encoding="utf-8"
              )

          try:
              # Load CSV
              df = pd.read_csv(
                  filename,
                  encoding="utf-8-sig"
              )

              # Validate expected columns
              required_columns = {"subject", "time"}

              missing_columns = (
                  required_columns - set(df.columns)
              )

              if missing_columns:
                  raise ValueError(
                      f"Missing required columns: {missing_columns}"
                  )

              print("[PASS] Pandas DataFrame loaded successfully.")
              print("[INFO] Total rows:", len(df))
              print("[INFO] Columns:", list(df.columns))
              print("[INFO] Python version:", sys.version)

          except Exception as e:
              print("[FAIL] Pipeline verification failed:", str(e))
              sys.exit(1)

          PY
          
