
name: ExamReadyTimer Cross-Platform Package Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Test Portable User Data Storage
        run: python -m pytest -q tests

      - name: Validate Syllabus CSV Structure
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("dataorsubjects.csv")
          with path.open("r", newline="", encoding="utf-8-sig") as stream:
              reader = csv.DictReader(stream)
              required = {"Subject", "Chapter", "Status"}
              if not required.issubset(reader.fieldnames or []):
                  raise SystemExit("Required syllabus columns are missing")
              rows = list(reader)
          if not rows:
              raise SystemExit("Syllabus CSV contains no data rows")
          if any(not row.get("Subject") or not row.get("Chapter") or not row.get("Status") for row in rows):
              raise SystemExit("Syllabus CSV contains an incomplete row")
          print(f"CSV validation passed: {len(rows)} syllabus rows")
          PY
