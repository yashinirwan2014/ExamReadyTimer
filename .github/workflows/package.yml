name: ExamReadyTimer Cross-Platform Package Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run complete unit test suite
        run: python -m pytest -q tests
      - name: Validate all starter data CSV files
        run: python scripts/validate_study_data.py
      - name: Compile application modules
        run: python -m py_compile main.py GUI.py countdown.py pomodoro.py timetable.py tracker.py progress.py focus.py settings.py backup.py storage.py schedule_utils.py reminders.py scripts/validate_study_data.py
